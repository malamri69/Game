<!doctype html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(0.16 0.02 265);
      --surface: oklch(0.21 0.025 265);
      --surface-2: oklch(0.25 0.03 265);
      --border: oklch(0.33 0.03 265);
      --fg: oklch(0.95 0.01 90);
      --muted: oklch(0.65 0.02 265);
      --gold: oklch(0.78 0.14 85);
      --gold-deep: oklch(0.68 0.14 80);
      --ink: oklch(0.18 0.02 265);
      --font-display: 'Cinzel', Georgia, serif;
      --font-body: 'Manrope', Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    a { color: var(--gold); }
    a:hover { color: var(--gold-deep); }
    ::placeholder { color: var(--muted); opacity: 1; }
  </style>
</helmet>
<div style="margin:0; width:390px; height:844px; background:var(--bg); font-family:var(--font-body); color:var(--fg); position:relative; overflow:hidden; border-radius:36px;">

  <!-- decorative crown watermark -->
  <svg style="position:absolute; top:38px; left:50%; transform:translateX(-50%); opacity:0.07;" width="260" height="195" viewBox="0 0 120 90" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M10 70 L10 40 L30 55 L45 20 L60 45 L75 20 L90 55 L110 40 L110 70 Z"/>
    <line x1="10" y1="78" x2="110" y2="78"/>
    <circle cx="45" cy="20" r="4" fill="var(--gold)" stroke="none"/>
    <circle cx="60" cy="45" r="4" fill="var(--gold)" stroke="none"/>
    <circle cx="75" cy="20" r="4" fill="var(--gold)" stroke="none"/>
  </svg>
  <div style="position:absolute; inset:0; background: radial-gradient(ellipse 420px 300px at 50% 8%, oklch(0.78 0.14 85 / 0.10), transparent 70%);"></div>

  <div style="position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:32px;">

    <div style="font-size:60px; line-height:1;">👑</div>

    <div style="height:14px;"></div>

    <div style="font-family:var(--font-display); font-size:28px; font-weight:700; letter-spacing:0.5px; text-align:center;">The Unknown King</div>

    <div style="width:60px; height:1px; background:var(--border); margin:22px 0;"></div>

    <div style="width:280px; display:flex; flex-direction:column; gap:14px;">
      <div style="width:100%; height:52px; border:1.5px solid var(--border); border-radius:14px; background:var(--surface); display:flex; align-items:center; justify-content:center;">
        <span style="color:var(--muted); font-size:15px;">Your name</span>
      </div>

      <div style="width:100%; height:52px; border-radius:14px; background:linear-gradient(180deg, var(--gold), var(--gold-deep)); display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 30px -8px oklch(0.78 0.14 85 / 0.55);">
        <span style="color:var(--ink); font-size:16px; font-weight:800; font-family:var(--font-display);">Enter</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
