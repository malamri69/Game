<!doctype html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(0.15 0.02 265);
      --surface: oklch(0.21 0.025 265);
      --border: oklch(0.33 0.03 265);
      --fg: oklch(0.95 0.01 90);
      --muted: oklch(0.66 0.02 265);
      --gold: oklch(0.78 0.14 85);
      --gold-deep: oklch(0.68 0.14 80);
      --ink: oklch(0.18 0.02 265);
      --font-display: 'Cinzel', Georgia, serif;
      --font-body: 'Manrope', Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    a { color: var(--gold); } a:hover { color: var(--gold-deep); }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      45% { opacity: 0.8; }
      55% { opacity: 0.95; }
      70% { opacity: 0.72; }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    .seat-name { font-size: 11px; font-family: var(--font-body); }
    .seat-name.you { fill: var(--gold); font-weight: 700; }
    .seat-name.mystery { fill: var(--muted); }
  </style>
</helmet>
<div style="margin:0; width:390px; height:844px; background:var(--bg); font-family:var(--font-body); color:var(--fg); position:relative; overflow:hidden; border-radius:36px; display:flex; flex-direction:column; justify-content:center; gap:28px;">

  <div style="position:absolute; inset:0; background: radial-gradient(ellipse 380px 340px at 50% 34%, oklch(0.78 0.14 85 / 0.10), transparent 65%); pointer-events:none;"></div>

  <div style="position:relative; text-align:center;">
    <div style="font-size:12px; color:var(--muted); letter-spacing:1.5px;">GATHERING AT THE TABLE</div>
  </div>

  <div style="position:relative; display:flex; align-items:center; justify-content:center;">
    <svg viewBox="0 0 390 380" width="390" height="380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="tableFill" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="oklch(0.29 0.045 55)"/>
          <stop offset="70%" stop-color="oklch(0.22 0.04 55)"/>
          <stop offset="100%" stop-color="oklch(0.13 0.03 50)"/>
        </radialGradient>
        <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="oklch(0.85 0.15 85 / 0.85)"/>
          <stop offset="100%" stop-color="oklch(0.85 0.15 85 / 0)"/>
        </radialGradient>
        <radialGradient id="figureFill" cx="45%" cy="25%" r="80%">
          <stop offset="0%" stop-color="oklch(0.34 0.02 265)"/>
          <stop offset="100%" stop-color="oklch(0.11 0.015 265)"/>
        </radialGradient>
        <radialGradient id="youFill" cx="45%" cy="25%" r="80%">
          <stop offset="0%" stop-color="oklch(0.5 0.08 85)"/>
          <stop offset="100%" stop-color="oklch(0.28 0.06 80)"/>
        </radialGradient>
        <symbol id="hoodedFigure" viewBox="-20 -20 40 40">
          <path d="M0,-15 C6.5,-15 10,-10.5 10,-5.5 C10,-2.5 8.8,0.5 6.5,2.5
                   C12,4.5 17,10 17,17 L-17,17 C-17,10 -12,4.5 -6.5,2.5
                   C-8.8,0.5 -10,-2.5 -10,-5.5 C-10,-10.5 -6.5,-15 0,-15 Z"
                fill="url(#figureFill)" />
          <circle cx="-3.2" cy="-5" r="0.9" fill="oklch(0.8 0.13 85 / 0.8)" />
          <circle cx="3.2" cy="-5" r="0.9" fill="oklch(0.8 0.13 85 / 0.8)" />
        </symbol>
        <symbol id="youFigure" viewBox="-20 -20 40 40">
          <path d="M0,-15 C6.5,-15 10,-10.5 10,-5.5 C10,-2.5 8.8,0.5 6.5,2.5
                   C12,4.5 17,10 17,17 L-17,17 C-17,10 -12,4.5 -6.5,2.5
                   C-8.8,0.5 -10,-2.5 -10,-5.5 C-10,-10.5 -6.5,-15 0,-15 Z"
                fill="url(#youFill)" />
        </symbol>
      </defs>

      <ellipse cx="195" cy="200" rx="150" ry="90" fill="black" opacity="0.35" />
      <ellipse cx="195" cy="190" rx="148" ry="88" fill="url(#tableFill)" stroke="oklch(0.42 0.06 60)" stroke-width="2" />
      <ellipse cx="195" cy="190" rx="120" ry="68" fill="none" stroke="oklch(0.36 0.05 58)" stroke-width="1" opacity="0.55" />

      <circle cx="195" cy="190" r="44" fill="url(#candleGlow)" style="animation: flicker 2.6s ease-in-out infinite;" />
      <rect x="192" y="177" width="6" height="16" rx="2" fill="oklch(0.85 0.02 70)" />
      <circle cx="195" cy="176" r="4.5" fill="oklch(0.93 0.12 85)" />

      <!-- filled seat: theta 45 -->
      <g transform="translate(297.5,250)">
        <circle r="24" fill="oklch(0.19 0.02 265)" stroke="var(--border)" stroke-width="1.5" />
        <use href="#hoodedFigure" width="34" height="34" x="-17" y="-17" />
      </g>
      <text x="297.5" y="286" text-anchor="middle" class="seat-name mystery">???</text>

      <!-- filled seat: theta -45 -->
      <g transform="translate(297.5,130)">
        <circle r="24" fill="oklch(0.19 0.02 265)" stroke="var(--border)" stroke-width="1.5" />
        <use href="#hoodedFigure" width="34" height="34" x="-17" y="-17" />
      </g>
      <text x="297.5" y="94" text-anchor="middle" class="seat-name mystery">???</text>

      <!-- filled seat: theta 180 -->
      <g transform="translate(50,190)">
        <circle r="24" fill="oklch(0.19 0.02 265)" stroke="var(--border)" stroke-width="1.5" />
        <use href="#hoodedFigure" width="34" height="34" x="-17" y="-17" />
      </g>
      <text x="50" y="226" text-anchor="middle" class="seat-name mystery">???</text>

      <!-- empty seat: theta 0 -->
      <g transform="translate(340,190)">
        <circle r="24" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 5" style="animation: pulseRing 2.4s ease-in-out infinite;" />
      </g>

      <!-- empty seat: theta -90 -->
      <g transform="translate(195,105)">
        <circle r="24" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 5" style="animation: pulseRing 2.4s ease-in-out infinite; animation-delay: 0.4s;" />
      </g>

      <!-- empty seat: theta -135 -->
      <g transform="translate(92.5,130)">
        <circle r="24" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 5" style="animation: pulseRing 2.4s ease-in-out infinite; animation-delay: 0.8s;" />
      </g>

      <!-- empty seat: theta 135 -->
      <g transform="translate(92.5,250)">
        <circle r="24" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 5" style="animation: pulseRing 2.4s ease-in-out infinite; animation-delay: 1.2s;" />
      </g>

      <!-- you: theta 90, bottom, nearest viewer -->
      <g transform="translate(195,275)">
        <circle r="27" fill="oklch(0.19 0.02 265)" stroke="var(--gold)" stroke-width="2" />
        <use href="#youFigure" width="38" height="38" x="-19" y="-19" />
      </g>
      <text x="195" y="315" text-anchor="middle" class="seat-name you">YOU</text>
    </svg>
  </div>

  <div style="position:relative; text-align:center; padding:0 32px;">
    <div style="font-size:16px; font-weight:700;">Waiting for the table to fill&hellip;</div>
    <div style="margin-top:6px; font-size:12.5px; color:var(--muted); line-height:1.6;">3 of 8 seated. If we're short, the AI takes the rest 🤖</div>
  </div>

  <div style="position:relative; display:flex; flex-direction:column; align-items:center;">
    <div style="font-size:11px; color:var(--muted); letter-spacing:1px;">ROOM CODE</div>
    <div style="margin-top:6px; padding:12px 26px; border-radius:14px; background:var(--surface); border:1.5px solid var(--border); font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:6px; color:var(--gold);">K7P9</div>
  </div>

</div>
</x-dc>
</body>
</html>
