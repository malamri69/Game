<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(0.16 0.02 265);
      --surface: oklch(0.21 0.025 265);
      --surface-2: oklch(0.27 0.03 265);
      --border: oklch(0.33 0.03 265);
      --fg: oklch(0.95 0.01 90);
      --muted: oklch(0.65 0.02 265);
      --gold: oklch(0.78 0.14 85);
      --gold-deep: oklch(0.68 0.14 80);
      --ink: oklch(0.18 0.02 265);
      --green: oklch(0.72 0.15 145);
      --font-display: 'Reem Kufi', Tahoma, sans-serif;
      --font-body: 'Cairo', Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    a { color: var(--gold); } a:hover { color: var(--gold-deep); }
    .pcard { width:76px; padding:8px 6px; border:1px solid var(--border); border-radius:12px; background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:5px; }
    .avatar { width:38px; height:38px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
    .pname { font-size:11px; max-width:66px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  </style>
</helmet>
<div style="margin:0; width:390px; height:844px; background:var(--bg); font-family:var(--font-body); color:var(--fg); position:relative; overflow:hidden; border-radius:36px; display:flex; flex-direction:column;">

  <!-- top bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px;">
    <span style="font-size:12px; color:var(--muted);">جولة ١/٤</span>
    <span style="font-size:13px; font-weight:800; font-family:var(--font-display);">👑 دورك</span>
    <span style="font-size:13px; color:var(--gold); font-weight:700;">⏱ ٦s</span>
  </div>
  <div style="height:1px; background:var(--border); margin:0 20px;"></div>

  <!-- middle, scrollable -->
  <div style="flex:1; overflow:hidden; padding:18px 20px;">

    <div style="border:1px solid var(--border); border-radius:18px; background:var(--surface); padding:22px 18px; text-align:center; position:relative; overflow:hidden;">
      <div style="position:absolute; inset:0; background: radial-gradient(ellipse 260px 140px at 50% -10%, oklch(0.78 0.14 85 / 0.12), transparent 70%);"></div>
      <div style="position:relative;">
        <div style="font-size:13px; color:var(--muted);">👑 المملكة تستيقظ…</div>
        <div style="margin-top:10px; font-family:var(--font-display); font-size:24px; font-weight:700;">دورك: الملك</div>
        <div style="margin-top:10px; font-size:14px; line-height:1.8;">ابقَ في الحكم حتى نهاية المباراة.</div>
        <div style="margin-top:6px; font-size:12.5px; color:var(--muted); line-height:1.8;">أصدر أمرًا ملكيًا مرة كل جولة، ولديك دفاع محدود ضد التهديدات.</div>

        <div style="margin:16px 0; height:1px; background:var(--border);"></div>

        <div style="font-size:13px; font-weight:700;">معلومة سرية 🤫</div>
        <div style="margin-top:6px; font-size:13px; color:var(--fg); line-height:1.7;">قائد الحرس يملك مفتاح القصر.</div>
      </div>
    </div>

    <div style="margin-top:20px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
      <div class="pcard"><div class="avatar">س</div><div class="pname">سالم</div><div style="display:flex; align-items:center; gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);"></div><div style="font-size:9px; color:var(--muted);">١٠٠💰</div></div></div>
      <div class="pcard"><div class="avatar">ن</div><div class="pname">نورة</div><div style="display:flex; align-items:center; gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);"></div><div style="font-size:9px; color:var(--muted);">١٠٠💰</div></div></div>
      <div class="pcard"><div class="avatar">ف</div><div class="pname">فيصل</div><div style="display:flex; align-items:center; gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);"></div><div style="font-size:9px; color:var(--muted);">١٠٠💰</div></div></div>
      <div class="pcard"><div class="avatar">ع</div><div class="pname">عبير</div><div style="display:flex; align-items:center; gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);"></div><div style="font-size:9px; color:var(--muted);">١٠٠💰</div></div></div>
      <div class="pcard"><div class="avatar">خ</div><div class="pname">خالد</div><div style="display:flex; align-items:center; gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);"></div><div style="font-size:9px; color:var(--muted);">١٠٠💰</div></div></div>
      <div class="pcard"><div class="avatar">ل</div><div class="pname">لمى</div><div style="display:flex; align-items:center; gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--green);"></div><div style="font-size:9px; color:var(--muted);">١٠٠💰</div></div></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
